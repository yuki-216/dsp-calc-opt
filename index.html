<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script>
        // 手机(小屏+高DPR)强制桌面等效宽度:CSS 视口=物理像素宽度 → 走桌面档,用户可缩放
        (function () {
            var dpr = window.devicePixelRatio || 1;
            var w = screen.width * dpr;                 // 物理像素宽度(如 390×3≈1170)
            if (screen.width < 600 && dpr > 1 && w > 900) {
                var vp = document.querySelector('meta[name="viewport"]');
                vp.setAttribute('content', 'width=' + Math.round(w) + ', user-scalable=yes');
            }
        })();
    </script>
    <meta name="theme-color" content="#212529"/>
    <meta name="description" content="戴森球计划生产线量化计算工具"/>
    <link rel="icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" href="/pwa-icon.svg"/>
    <title>戴森球计划量化计算器</title>
</head>

<body>
<div id="icon-styles"></div>
<div id="header">
    <div style="padding:.5rem 1rem;background:#f8f9fa;border-bottom:1px solid #dee2e6;font-family:system-ui,sans-serif;">
        <strong>戴森球计划量化计算器</strong>
        <span style="float:right;font-size:14px;color:#6c757d;">&#9432; 若无法加载，尝试切换浏览器为Chrome/Edge</span>
    </div>
</div>
<div class="p-3">
    <div id="root"></div>
</div>
<div id="pwa-prompt"></div>
<script type="module" src="src/main.jsx"></script>
</body>

</html>
